<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>SAT статистика</title>
<style>
  :root {
    color-scheme: light;
    --page:           #f9f9f7;
    --surface:        #fcfcfb;
    --text-primary:   #0b0b0b;
    --text-secondary: #52514e;
    --text-muted:     #898781;
    --grid:           #e1e0d9;
    --baseline:       #c3c2b7;
    --border:         rgba(11, 11, 11, .10);
    --hover:          rgba(11, 11, 11, .04);

    /* Ряды графика. Проверено валидатором: CVD dE 24.7, normal dE 33.6 */
    --series-1: #2a78d6;
    --series-2: #eb6834;

    /* Упорядоченная шкала скорости: один тон, светлее -> темнее */
    --speed-fast:   #86b6ef;
    --speed-normal: #3987e5;
    --speed-slow:   #184f95;

    /* Статусные цвета: тут цвет действительно означает хорошо/плохо */
    --status-good:     #0ca30c;
    --status-critical: #d03b3b;
    --status-neutral:  #898781;
  }

  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --page:           #0d0d0d;
      --surface:        #1a1a19;
      --text-primary:   #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted:     #898781;
      --grid:           #2c2c2a;
      --baseline:       #383835;
      --border:         rgba(255, 255, 255, .10);
      --hover:          rgba(255, 255, 255, .06);
      --series-1: #3987e5;
      --series-2: #d95926;
    }
  }

  :root[data-theme="dark"] {
    color-scheme: dark;
    --page:           #0d0d0d;
    --surface:        #1a1a19;
    --text-primary:   #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted:     #898781;
    --grid:           #2c2c2a;
    --baseline:       #383835;
    --border:         rgba(255, 255, 255, .10);
    --hover:          rgba(255, 255, 255, .06);
    --series-1: #3987e5;
    --series-2: #d95926;
  }

  * { box-sizing: border-box; }

  /* Движение подчинено смыслу: показать, что пересчиталось после клика.
     Длительности короткие — интерфейс должен ощущаться быстрым. */
  :root {
    --ease: cubic-bezier(.2, .7, .3, 1);
    --dur-fast: .18s;
    --dur: .38s;
  }

  /* Уважаем системную настройку: для части людей анимация вызывает
     тошноту и головокружение, а мигание — риск при светочувствительности. */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .001ms !important;
      animation-delay: 0s !important;
      transition-duration: .001ms !important;
    }
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(10px); }
  }

  @keyframes pop {
    from { opacity: 0; transform: scale(.9); }
  }

  body {
    margin: 0;
    padding: 1.5rem 1rem 4rem;
    background: var(--page);
    color: var(--text-primary);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    line-height: 1.5;
    overflow-x: hidden;
  }

  main { max-width: 68rem; margin: 0 auto; }

  header {
    display: flex;
    flex-wrap: wrap;
    gap: .5rem 1rem;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 1rem;
  }

  h1 { margin: 0; font-size: 1.375rem; letter-spacing: -.01em; }

  .stamp {
    color: var(--text-muted); font-size: .8125rem;
    /* Строка состояния растёт: «обновлено … · данные обновлены · зона роста …».
       Без переноса она вытолкнула бы кнопку за край на узком экране. */
    display: flex; align-items: center; flex-wrap: wrap; gap: .375rem .75rem;
  }
  .stamp a { color: var(--text-muted); }

  #refresh {
    font: inherit; font-size: .8125rem;
    display: inline-flex; align-items: center; gap: .4rem;
    padding: .25rem .625rem;
    border: 1px solid var(--border); border-radius: 999px;
    background: transparent; color: var(--text-secondary);
    cursor: pointer;
    transition: border-color var(--dur-fast) var(--ease),
                color var(--dur-fast) var(--ease);
  }
  #refresh:hover:not(:disabled) { border-color: var(--text-muted); color: var(--text-primary); }
  #refresh:disabled { cursor: default; opacity: .6; }

  #refresh svg { width: .875rem; height: .875rem; display: block; }
  /* Крутится только пока идёт запрос — иначе это просто мельтешение */
  #refresh[data-busy] svg { animation: spin 1s linear infinite; }

  @keyframes spin { to { transform: rotate(360deg); } }

  .flash { animation: flash 1.4s var(--ease); }
  @keyframes flash { 0%, 60% { color: var(--status-good); } }

  h2 {
    margin: 0 0 1rem;
    font-size: .9375rem;
    font-weight: 600;
    color: var(--text-secondary);
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.25rem;
    margin-bottom: 1rem;
  }

  .cols { display: grid; gap: 1rem; grid-template-columns: 1fr; }
  @media (min-width: 46rem) { .cols { grid-template-columns: 1fr 1fr; } }

  /* --- активные фильтры --- */
  .chips {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: .5rem;
    margin-bottom: 1rem;
  }
  .chips.hidden { display: none; }

  .chips-label { font-size: .8125rem; color: var(--text-muted); }

  .chip {
    display: inline-flex;
    align-items: center;
    gap: .4rem;
    font: inherit;
    font-size: .8125rem;
    padding: .25rem .5rem .25rem .75rem;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-primary);
    cursor: pointer;
    animation: pop var(--dur-fast) var(--ease);
    transition: border-color var(--dur-fast) var(--ease);
  }
  .chip:hover { border-color: var(--text-muted); }
  .chip .x { color: var(--text-muted); font-size: 1rem; line-height: 1; transition: color var(--dur-fast); }
  .chip:hover .x { color: var(--text-primary); }
  .chip .dim { color: var(--text-muted); }

  .chip-clear {
    font: inherit;
    font-size: .8125rem;
    background: none;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    text-decoration: underline;
  }

  /* --- KPI --- */
  .kpi {
    display: grid;
    gap: .625rem;
    grid-template-columns: repeat(auto-fit, minmax(9.5rem, 1fr));
    margin-bottom: 1rem;
  }

  .tile {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1rem 1.125rem;
  }
  .tile .label { font-size: .8125rem; color: var(--text-secondary); }
  .tile .value {
    font-size: 1.75rem; font-weight: 600; margin-top: .25rem; letter-spacing: -.02em;
    /* Цифры перебираются при пересчёте, поэтому ширина знаков должна быть
       постоянной — иначе плитка дёргается на каждом кадре. */
    font-variant-numeric: tabular-nums;
  }

  /* Появление блоков при первой загрузке. Класс снимается после, чтобы
     анимация не повторялась на каждом пересчёте по фильтру. */
  .intro .tile, .intro .card { animation: rise var(--dur) var(--ease) backwards; }
  .intro .tile:nth-child(2) { animation-delay: .04s; }
  .intro .tile:nth-child(3) { animation-delay: .08s; }
  .intro .tile:nth-child(4) { animation-delay: .12s; }
  .intro .tile:nth-child(5) { animation-delay: .16s; }
  .intro .card:nth-of-type(n) { animation-delay: .12s; }

  /* --- график --- */
  .filters { display: flex; flex-wrap: wrap; gap: .5rem; margin-bottom: 1rem; }

  .filters button {
    font: inherit;
    font-size: .8125rem;
    padding: .3125rem .75rem;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-secondary);
    cursor: pointer;
    transition: background var(--dur-fast) var(--ease),
                color var(--dur-fast) var(--ease),
                border-color var(--dur-fast) var(--ease);
  }
  .filters button:hover { border-color: var(--text-muted); }

  .filters button[aria-pressed="true"] {
    background: var(--text-primary);
    color: var(--surface);
    border-color: var(--text-primary);
  }

  .plot { position: relative; }
  svg { display: block; width: 100%; height: auto; }
  #hit { cursor: pointer; }

  .tooltip {
    position: absolute;
    pointer-events: none;
    opacity: 0;
    transition: opacity .1s;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: .5rem .625rem;
    font-size: .8125rem;
    white-space: nowrap;
    box-shadow: 0 4px 14px rgba(0,0,0,.12);
    z-index: 5;
  }
  .tooltip.on { opacity: 1; }
  .tooltip .t-date { color: var(--text-muted); margin-bottom: .25rem; }
  .tooltip .t-row { display: flex; align-items: center; gap: .4rem; }
  .tooltip .t-hint { color: var(--text-muted); margin-top: .25rem; font-size: .75rem; }

  .legend { display: flex; flex-wrap: wrap; gap: .25rem 1rem; margin-top: .75rem; }
  .legend-item {
    display: flex; align-items: center; gap: .4rem;
    font-size: .8125rem; color: var(--text-secondary);
  }
  .swatch { width: .625rem; height: .625rem; border-radius: 3px; flex: none; }
  .swatch.line { width: 1rem; height: 2px; border-radius: 2px; }

  button.legend-item {
    font: inherit; font-size: .8125rem;
    background: none; border: none; padding: .125rem .25rem;
    border-radius: 6px; cursor: pointer; color: var(--text-secondary);
  }
  button.legend-item { transition: background var(--dur-fast) var(--ease), color var(--dur-fast); }
  button.legend-item:hover { background: var(--hover); }
  button.legend-item[aria-pressed="true"] { color: var(--text-primary); font-weight: 600; }

  /* --- составная полоса --- */
  .stack { display: flex; gap: 2px; height: 20px; margin-bottom: .875rem; }
  .stack > div:first-child { border-radius: 5px 0 0 5px; }
  .stack > div:last-child { border-radius: 0 5px 5px 0; }
  /* Доли перетекают при смене фильтра — видно, что именно пересчиталось */
  .stack > div { flex-grow: 0; transition: flex-grow var(--dur) var(--ease); }

  /* --- таблицы --- */
  .scroll { overflow-x: auto; }

  table { border-collapse: collapse; width: 100%; font-size: .8125rem; }

  th, td {
    text-align: right;
    padding: .5rem .625rem;
    border-bottom: 1px solid var(--grid);
    white-space: nowrap;
  }
  th { color: var(--text-muted); font-weight: 500; }
  th:first-child, td:first-child { text-align: left; white-space: normal; min-width: 9rem; }
  tbody tr:last-child td { border-bottom: none; }
  td.num { font-variant-numeric: tabular-nums; }

  tbody tr[data-dim] { cursor: pointer; transition: background var(--dur-fast) var(--ease); }
  tbody tr[data-dim]:hover { background: var(--hover); }
  tbody tr[aria-selected="true"] { background: var(--hover); font-weight: 600; }
  tbody tr { animation: rise var(--dur-fast) var(--ease) backwards; }

  .meter { display: flex; align-items: center; gap: .5rem; justify-content: flex-end; }
  .meter-track {
    width: 4.5rem; height: 6px; flex: none;
    background: var(--grid); border-radius: 3px; overflow: hidden;
  }
  .meter-fill {
    display: block; height: 100%; border-radius: 3px; background: var(--series-1);
    width: 0;
    transition: width var(--dur) var(--ease);
  }

  .empty { color: var(--text-muted); font-size: .875rem; }
  .note { color: var(--text-muted); font-size: .75rem; margin: .75rem 0 0; }
  .hidden { display: none; }
</style>
</head>
<body>
<main>
  <header>
    <h1>SAT статистика</h1>
    <div class="stamp">
      <span id="stamp">загрузка…</span>
      <button type="button" id="refresh" hidden title="Перечитать таблицу заново">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/>
        </svg>
        <span id="refresh-label">Обновить</span>
      </button>
      <a href="/logout">Выйти</a>
    </div>
  </header>

  <div id="content" class="hidden">
    <div class="chips hidden" id="chips"></div>

    <div class="kpi" id="kpi"></div>

    <section class="card">
      <h2>Точность по дням</h2>
      <div class="filters" id="trend-filters">
        <button type="button" data-mode="all" aria-pressed="true">Всё вместе</button>
        <button type="button" data-mode="sections" aria-pressed="false">По разделам</button>
      </div>
      <div class="plot">
        <div id="chart"></div>
        <div class="tooltip" id="tip"></div>
      </div>
      <div class="legend" id="legend"></div>
      <p class="note">Клик по точке — показать только этот день. Повторный клик снимает выбор.</p>
    </section>

    <section class="card" id="sections-card">
      <h2>Разделы</h2>
      <div class="scroll" id="sections"></div>
    </section>

    <div class="cols">
      <section class="card" id="speed-card">
        <h2>Скорость</h2>
        <div id="speed"></div>
      </section>
      <section class="card" id="results-card">
        <h2>Результаты</h2>
        <div id="results"></div>
      </section>
    </div>

    <section class="card" id="books-card">
      <h2>Книги и источники</h2>
      <div class="scroll" id="books"></div>
    </section>

    <section class="card" id="topics-card">
      <h2>Темы</h2>
      <div class="scroll" id="topics"></div>
      <p class="note" id="topics-note"></p>
    </section>
  </div>

  <p id="message" class="empty">загрузка…</p>
</main>

<script>
"use strict";

const SERIES_VARS = ["--series-1", "--series-2"];
const TOPIC_LIMIT = 20;

// Системная настройка «уменьшить движение» отключает всю анимацию,
// включая ту, что делается из JS, а не только CSS-переходы.
const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;
const DURATION = 380;

const cssVar = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const el = (id) => document.getElementById(id);
const nf = new Intl.NumberFormat("ru-RU");

// Округление обязательно: значение приходит и из перебора цифр, где оно
// дробное, а в русской локали 634.418 печатается как «634,418» и читается
// как число совсем другого порядка.
const fmtInt = (v) => (v == null ? "—" : nf.format(Math.round(v)));
const fmtPct = (v) => (v == null ? "—" : `${(v * 100).toFixed(1).replace(".", ",")}%`);
const fmtSec = (v) => (v == null ? "—" : `${v.toFixed(1).replace(".", ",")} с`);

function fmtDate(iso, withYear) {
  if (!iso) return "—";
  const [y, m, d] = iso.split("-");
  return withYear ? `${d}.${m}.${y}` : `${d}.${m}`;
}

function escapeHtml(text) {
  return String(text ?? "").replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

const RESULT_COLORS = {
  "Правильно": "--status-good",
  "Неправильно": "--status-critical",
  "Пропущено": "--status-neutral",
};

const SPEED_COLORS = {
  "Быстро": "--speed-fast",
  "В норме": "--speed-normal",
  "Медленно": "--speed-slow",
};

// Порядок фиксированный: он же задаёт порядок сегментов в полосе.
const SPEED_ORDER = ["Быстро", "В норме", "Медленно"];
const RESULT_ORDER = ["Правильно", "Неправильно", "Пропущено"];

const DIM_LABELS = {
  date: "День", section: "Раздел", book: "Книга",
  topic: "Тема", speed: "Скорость", result: "Результат",
};

const DIMS = Object.keys(DIM_LABELS);

// ---------- состояние ----------

const state = { data: null, filters: {}, trendMode: "all" };

/* Ключевое правило перекрёстной фильтрации: каждый блок фильтруется всеми
   активными условиями, КРОМЕ своего собственного измерения. Иначе, выбрав
   книгу, ты увидел бы таблицу книг из одной строки и не смог бы переключиться
   на другую. А KPI считается по всем условиям сразу — это итог выбора. */
function rowsFor(except) {
  const active = DIMS.filter((d) => d !== except && state.filters[d] != null);

  if (!active.length) return state.data.rows;

  return state.data.rows.filter((row) => active.every((d) => row[d] === state.filters[d]));
}

function toggleFilter(dim, value) {
  if (state.filters[dim] === value) delete state.filters[dim];
  else state.filters[dim] = value;

  render();
}

// ---------- агрегация ----------

function aggregate(rows) {
  const stat = { questions: rows.length, correct: 0, wrong: 0, skipped: 0, slow: 0 };
  let timeSum = 0, timed = 0;

  for (const row of rows) {
    if (row.result === "Правильно") stat.correct++;
    else if (row.result === "Неправильно") stat.wrong++;
    else if (row.result === "Пропущено") stat.skipped++;

    if (row.speed === "Медленно") stat.slow++;

    if (typeof row.time === "number") { timeSum += row.time; timed++; }
  }

  stat.accuracy = rows.length ? stat.correct / rows.length : null;
  stat.avgTime = timed ? timeSum / timed : null;

  return stat;
}

function groupBy(rows, dim) {
  const groups = new Map();

  for (const row of rows) {
    const key = row[dim];
    if (key == null) continue;
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(row);
  }

  return groups;
}

function summarize(rows, dim) {
  return [...groupBy(rows, dim)].map(([key, group]) => ({ key, ...aggregate(group) }));
}

// ---------- график ----------

const W = 760, H = 280, PAD = { t: 16, r: 60, b: 34, l: 46 };
const PLOT_W = W - PAD.l - PAD.r;
const PLOT_H = H - PAD.t - PAD.b;

let chartState = null;

function buildSeries() {
  const rows = rowsFor("date");
  const dates = [...new Set(rows.map((r) => r.date).filter(Boolean))].sort();

  if (state.trendMode === "sections") {
    // Цвет закреплён за разделом по имени, а не по месту в списке:
    // иначе смена порядка перекрашивала бы ряды.
    const names = [...new Set(rows.map((r) => r.section))].sort((a, b) => a.localeCompare(b, "ru"));

    return names.slice(0, SERIES_VARS.length).map((name, i) => {
      const byDate = groupBy(rows.filter((r) => r.section === name), "date");
      return {
        name,
        color: cssVar(SERIES_VARS[i]),
        points: dates.map((d) => ({ date: d, ...aggregate(byDate.get(d) ?? []) })),
      };
    });
  }

  const byDate = groupBy(rows, "date");

  return [{
    name: "Все разделы",
    color: cssVar("--series-1"),
    points: dates.map((d) => ({ date: d, ...aggregate(byDate.get(d) ?? []) })),
  }];
}

function buildChart(series) {
  const points = series[0]?.points ?? [];

  if (!points.length) {
    el("chart").innerHTML = '<p class="empty">Нет данных под текущий выбор.</p>';
    chartState = null;
    return;
  }

  const n = points.length;
  const x = (i) => PAD.l + (n === 1 ? PLOT_W / 2 : (i * PLOT_W) / (n - 1));

  /* Ось подрезается снизу до ближайшей четверти под минимумом: точность
     редко падает низко, и при шкале от нуля график сплющивался бы вверх.
     Деления остаются круглыми и показывают, где ось начинается. */
  const values = series.flatMap((s) => s.points.map((p) => p.accuracy)).filter((v) => v != null);
  const floorTick = values.length ? Math.floor(Math.min(...values) / 0.25) * 0.25 : 0;
  const yMin = Math.min(0.75, Math.max(0, floorTick));
  const y = (v) => PAD.t + PLOT_H - ((v - yMin) / (1 - yMin)) * PLOT_H;

  const ticks = [];
  for (let t = yMin; t <= 1.0001; t += 0.25) ticks.push(Math.round(t * 100) / 100);

  const surface = cssVar("--surface");
  const parts = [];

  for (const tick of ticks) {
    parts.push(
      `<line x1="${PAD.l}" y1="${y(tick).toFixed(1)}" x2="${PAD.l + PLOT_W}" y2="${y(tick).toFixed(1)}"
             stroke="var(--grid)" stroke-width="1" shape-rendering="crispEdges"/>`,
      `<text x="${PAD.l - 10}" y="${(y(tick) + 4).toFixed(1)}" text-anchor="end"
             font-size="11" fill="var(--text-muted)"
             style="font-variant-numeric:tabular-nums">${tick * 100}%</text>`);
  }

  parts.push(`<line x1="${PAD.l}" y1="${PAD.t + PLOT_H}" x2="${PAD.l + PLOT_W}" y2="${PAD.t + PLOT_H}"
                    stroke="var(--baseline)" stroke-width="1" shape-rendering="crispEdges"/>`);

  const step = Math.max(1, Math.ceil(n / 6));
  for (let i = 0; i < n; i += step) {
    parts.push(`<text x="${x(i).toFixed(1)}" y="${H - 12}" text-anchor="middle"
                      font-size="11" fill="var(--text-muted)">${fmtDate(points[i].date)}</text>`);
  }

  // Выбранный день отмечаем вертикалью — сам график при этом продолжает
  // показывать всю картину, иначе от него осталась бы одна точка.
  const selected = points.findIndex((p) => p.date === state.filters.date);

  if (selected >= 0) {
    parts.push(`<line x1="${x(selected).toFixed(1)}" y1="${PAD.t}"
                      x2="${x(selected).toFixed(1)}" y2="${PAD.t + PLOT_H}"
                      stroke="var(--text-primary)" stroke-width="1" opacity=".45"
                      shape-rendering="crispEdges"/>`);
  }

  for (const s of series) {
    const drawable = s.points.map((p, i) => ({ i, v: p.accuracy })).filter((p) => p.v != null);
    if (!drawable.length) continue;

    const d = drawable.map((p, k) => `${k ? "L" : "M"}${x(p.i).toFixed(1)} ${y(p.v).toFixed(1)}`).join(" ");
    parts.push(`<path class="series" d="${d}" fill="none" stroke="${s.color}" stroke-width="2"
                      stroke-linejoin="round" stroke-linecap="round"/>`);

    if (selected >= 0) {
      const point = s.points[selected];
      if (point.accuracy != null) {
        parts.push(`<circle cx="${x(selected).toFixed(1)}" cy="${y(point.accuracy).toFixed(1)}" r="4.5"
                            fill="${s.color}" stroke="${surface}" stroke-width="2"/>`);
      }
    }

    const last = drawable[drawable.length - 1];
    parts.push(`<circle cx="${x(last.i).toFixed(1)}" cy="${y(last.v).toFixed(1)}" r="4.5"
                        fill="${s.color}" stroke="${surface}" stroke-width="2"/>`);
    s._end = { x: x(last.i), y: y(last.v), value: last.v };
  }

  // Подписи у концов линий — только если не наезжают друг на друга.
  // Разводить их по вертикали нельзя: подпись оторвётся от своей линии.
  const ends = series.filter((s) => s._end).map((s) => s._end.y).sort((a, b) => a - b);

  if (!ends.some((v, i) => i > 0 && v - ends[i - 1] < 14)) {
    for (const s of series) {
      if (!s._end) continue;
      parts.push(`<text x="${(s._end.x + 10).toFixed(1)}" y="${(s._end.y + 4).toFixed(1)}"
                        font-size="12" font-weight="600" fill="var(--text-secondary)"
                        style="font-variant-numeric:tabular-nums">${fmtPct(s._end.value)}</text>`);
    }
  }

  parts.push(`<line id="crosshair" y1="${PAD.t}" y2="${PAD.t + PLOT_H}" stroke="var(--baseline)"
                    stroke-width="1" opacity="0" shape-rendering="crispEdges"/>`);
  parts.push(`<rect id="hit" x="${PAD.l}" y="${PAD.t}" width="${PLOT_W}" height="${PLOT_H}" fill="transparent"/>`);

  el("chart").innerHTML =
    `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Точность по дням">${parts.join("")}</svg>`;

  chartState = { series, n, x, y };
  attachChartEvents();
}

function nearestIndex(evt) {
  const svg = el("chart").querySelector("svg");
  const box = svg.getBoundingClientRect();
  const touch = evt.touches?.[0];
  const localX = ((touch ? touch.clientX : evt.clientX) - box.left) * (W / box.width);

  let best = 0;
  for (let i = 1; i < chartState.n; i++) {
    if (Math.abs(chartState.x(i) - localX) < Math.abs(chartState.x(best) - localX)) best = i;
  }

  return { best, box, scale: W / box.width };
}

function attachChartEvents() {
  const hit = el("hit");
  const cross = el("crosshair");
  const tip = el("tip");
  if (!hit) return;

  const move = (evt) => {
    const { best, box, scale } = nearestIndex(evt);
    const { series, x } = chartState;

    cross.setAttribute("x1", x(best));
    cross.setAttribute("x2", x(best));
    cross.setAttribute("opacity", "1");

    const date = series[0].points[best].date;

    const rows = series.map((s) => {
      const p = s.points[best];
      // Пропущенные показываем отдельно: они считаются как «не верно», и без
      // этого день, когда вопросы занесли но не решали, выглядит провалом.
      const skipped = p.skipped ? `, ${fmtInt(p.skipped)} пропущ.` : "";
      return `<div class="t-row"><span class="swatch" style="background:${s.color}"></span>
              ${escapeHtml(s.name)} — <strong>${fmtPct(p.accuracy)}</strong>
              <span style="color:var(--text-muted)">${fmtInt(p.questions)} вопр.${skipped}</span></div>`;
    }).join("");

    const hint = state.filters.date === date ? "клик — снять выбор" : "клик — только этот день";
    tip.innerHTML = `<div class="t-date">${fmtDate(date, true)}</div>${rows}
                     <div class="t-hint">${hint}</div>`;
    tip.classList.add("on");

    const px = x(best) / scale;
    tip.style.left = `${Math.max(0, Math.min(px - tip.offsetWidth / 2, box.width - tip.offsetWidth))}px`;
    tip.style.top = "0px";
  };

  const leave = () => {
    cross.setAttribute("opacity", "0");
    tip.classList.remove("on");
  };

  hit.addEventListener("mousemove", move);
  hit.addEventListener("mouseleave", leave);
  hit.addEventListener("touchmove", move, { passive: true });
  hit.addEventListener("touchend", leave);
  hit.addEventListener("click", (evt) => {
    const { best } = nearestIndex(evt);
    toggleFilter("date", chartState.series[0].points[best].date);
  });
}

// ---------- таблицы и полосы ----------

function table(columns, rows, dim) {
  const head = columns.map((c) => `<th>${c.title}</th>`).join("");

  const body = rows.map((row) => {
    const value = dim ? row.key : null;
    const attrs = dim
      ? ` data-dim="${dim}" data-val="${escapeHtml(value)}"` +
        (state.filters[dim] === value ? ' aria-selected="true"' : "")
      : "";
    return `<tr${attrs}>${columns.map((c) =>
      `<td class="${c.num ? "num" : ""}">${c.cell(row)}</td>`).join("")}</tr>`;
  }).join("");

  return `<table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table>`;
}

function meter(value) {
  if (value == null) return "—";
  // Ширина ставится не здесь, а следующим кадром в animateIn — иначе
  // элемент рождается уже нужного размера и переходу неоткуда начаться.
  const pct = Math.max(0, Math.min(1, value)) * 100;
  return `<div class="meter"><span>${fmtPct(value)}</span>
          <span class="meter-track"><span class="meter-fill" data-w="${pct.toFixed(1)}"></span></span></div>`;
}

const STAT_COLUMNS = [
  { title: "Вопросов", num: true, cell: (r) => fmtInt(r.questions) },
  { title: "Верно", num: true, cell: (r) => fmtInt(r.correct) },
  { title: "Пропущено", num: true, cell: (r) => fmtInt(r.skipped) },
  { title: "Медленных", num: true, cell: (r) => fmtInt(r.slow) },
  { title: "Ср. время", num: true, cell: (r) => fmtSec(r.avgTime) },
  { title: "Точность", num: true, cell: (r) => meter(r.accuracy) },
];

function renderStack(target, dim, order) {
  const stats = summarize(rowsFor(dim), dim);
  const byKey = new Map(stats.map((s) => [s.key, s]));
  const keys = order.filter((k) => byKey.has(k)).concat(stats.map((s) => s.key).filter((k) => !order.includes(k)));
  const total = stats.reduce((sum, s) => sum + s.questions, 0);

  if (!total) {
    el(target).innerHTML = '<p class="empty">Нет данных под текущий выбор.</p>';
    return;
  }

  const palette = dim === "speed" ? SPEED_COLORS : RESULT_COLORS;

  const bar = keys.map((k) => {
    const stat = byKey.get(k);
    return `<div style="background:${cssVar(palette[k] ?? "--status-neutral")}"
                 data-flex="${stat.questions}"
                 title="${escapeHtml(k)}: ${fmtInt(stat.questions)}"></div>`;
  }).join("");

  const legend = keys.map((k) => {
    const stat = byKey.get(k);
    const pressed = state.filters[dim] === k;
    return `<button type="button" class="legend-item" data-dim="${dim}" data-val="${escapeHtml(k)}"
                    aria-pressed="${pressed}">
              <span class="swatch" style="background:${cssVar(palette[k] ?? "--status-neutral")}"></span>
              ${escapeHtml(k)} — <strong>${fmtInt(stat.questions)}</strong>
              <span style="color:var(--text-muted)">${fmtPct(stat.questions / total)}</span>
            </button>`;
  }).join("");

  el(target).innerHTML = `<div class="stack">${bar}</div><div class="legend">${legend}</div>`;
}

// ---------- отрисовка ----------

function renderChips() {
  const active = DIMS.filter((d) => state.filters[d] != null);

  el("chips").classList.toggle("hidden", !active.length);

  if (!active.length) return;

  const chips = active.map((d) => {
    const value = d === "date" ? fmtDate(state.filters[d], true) : state.filters[d];
    return `<button type="button" class="chip" data-dim="${d}" data-val="${escapeHtml(state.filters[d])}">
              <span class="dim">${DIM_LABELS[d]}:</span> ${escapeHtml(value)}
              <span class="x" aria-hidden="true">×</span>
            </button>`;
  }).join("");

  el("chips").innerHTML =
    `<span class="chips-label">Фильтры:</span>${chips}
     <button type="button" class="chip-clear" id="clear-filters">сбросить всё</button>`;
}

const KPI_DEFS = [
  { label: "Вопросов", pick: (s) => s.questions, fmt: fmtInt },
  { label: "Точность", pick: (s) => s.accuracy, fmt: fmtPct },
  { label: "Среднее время", pick: (s) => s.avgTime, fmt: fmtSec },
  { label: "Медленных", pick: (s) => s.slow, fmt: fmtInt },
  { label: "Пропущено", pick: (s) => s.skipped, fmt: fmtInt },
];

const kpiShown = [];

/* Число перебирается от прежнего значения к новому. Смысл не в красоте:
   при клике по фильтру так видно, какие показатели изменились и куда,
   а какие остались прежними. Мгновенная подмена этого не показывает. */
function animateNumber(node, from, to, fmt) {
  cancelAnimationFrame(node._raf);
  clearTimeout(node._timer);

  if (REDUCED || from == null || to == null || from === to) {
    node.textContent = fmt(to);
    return;
  }

  const started = performance.now();

  const finish = () => {
    cancelAnimationFrame(node._raf);
    node.textContent = fmt(to);
  };

  const step = (now) => {
    const t = Math.min(1, (now - started) / DURATION);
    const eased = 1 - Math.pow(1 - t, 3);

    node.textContent = fmt(from + (to - from) * eased);

    if (t < 1) node._raf = requestAnimationFrame(step);
    else finish();
  };

  node._raf = requestAnimationFrame(step);

  /* Страховка. requestAnimationFrame замирает в фоновой вкладке, и без неё
     число осталось бы навсегда на промежуточном значении — то есть просто
     неверным. Таймер досчитывает результат независимо от кадров. */
  node._timer = setTimeout(finish, DURATION + 120);
}

function renderKpi() {
  const stat = aggregate(rowsFor(null));

  // Плитки строятся один раз: если пересобирать разметку, элементы
  // заменяются новыми и переход числа сыграть просто не на чем.
  if (!el("kpi").children.length) {
    el("kpi").innerHTML = KPI_DEFS.map((def) =>
      `<div class="tile"><div class="label">${def.label}</div><div class="value">—</div></div>`).join("");
  }

  KPI_DEFS.forEach((def, i) => {
    const value = def.pick(stat);
    const node = el("kpi").children[i].querySelector(".value");

    animateNumber(node, kpiShown[i], value, def.fmt);
    kpiShown[i] = value;
  });
}

function renderTrend() {
  const series = buildSeries();
  buildChart(series);

  // Один ряд не нуждается в легенде — заголовок уже говорит, что нарисовано
  el("legend").innerHTML = series.length < 2 ? "" : series.map((s) =>
    `<button type="button" class="legend-item" data-dim="section" data-val="${escapeHtml(s.name)}"
             aria-pressed="${state.filters.section === s.name}">
       <span class="swatch line" style="background:${s.color}"></span>${escapeHtml(s.name)}
     </button>`).join("");
}

function renderTable(target, dim, titleColumn, sort, limit) {
  let stats = summarize(rowsFor(dim), dim).sort(sort);
  const total = stats.length;

  if (limit && stats.length > limit) stats = stats.slice(0, limit);

  el(target).innerHTML = stats.length
    ? table([{ title: titleColumn, cell: (r) => escapeHtml(r.key) }, ...STAT_COLUMNS], stats, dim)
    : '<p class="empty">Нет данных под текущий выбор.</p>';

  return { shown: stats.length, total };
}

/* Запускает переходы у только что вставленных элементов.
   Приём общий: элемент рождается в начальном состоянии (нулевая ширина,
   линия «не нарисована»), и лишь следующим кадром получает целевое —
   тогда браузеру есть что анимировать. Поставь конечное значение сразу,
   и перехода не будет вовсе. */
function animateIn() {
  const line = el("chart").querySelector("path.series");

  if (line && !REDUCED) {
    for (const path of el("chart").querySelectorAll("path.series")) {
      const length = path.getTotalLength();
      path.style.strokeDasharray = length;
      path.style.strokeDashoffset = length;
      path.style.transition = "none";
    }
  }

  requestAnimationFrame(() => {
    for (const fill of document.querySelectorAll(".meter-fill[data-w]")) {
      fill.style.width = `${fill.dataset.w}%`;
    }

    for (const segment of document.querySelectorAll(".stack > div[data-flex]")) {
      segment.style.flexGrow = segment.dataset.flex;
    }

    if (REDUCED) return;

    for (const path of el("chart").querySelectorAll("path.series")) {
      path.style.transition = "stroke-dashoffset .6s var(--ease)";
      path.style.strokeDashoffset = "0";
    }
  });

  // Ряды таблиц появляются каскадом, но только первые — иначе длинная
  // таблица разворачивается заметно дольше, чем читается.
  document.querySelectorAll("tbody tr").forEach((row, i) => {
    row.style.animationDelay = i < 8 ? `${i * 25}ms` : "0ms";
  });
}

function render() {
  renderChips();
  renderKpi();
  renderTrend();

  renderTable("sections", "section", "Раздел", (a, b) => b.questions - a.questions);
  renderStack("speed", "speed", SPEED_ORDER);
  renderStack("results", "result", RESULT_ORDER);
  renderTable("books", "book", "Книга / источник", (a, b) => b.questions - a.questions);

  // Темы сортируем по среднему времени: смысл блока — где ты тормозишь
  const topics = renderTable("topics", "topic", "Тема",
    (a, b) => (b.avgTime ?? 0) - (a.avgTime ?? 0), TOPIC_LIMIT);

  el("topics-note").textContent = topics.total > topics.shown
    ? `Показаны ${topics.shown} самых медленных тем из ${topics.total}.`
    : "Отсортированы по среднему времени. Клик по строке — отфильтровать по теме.";

  animateIn();
}

// ---------- события ----------

document.addEventListener("click", (evt) => {
  if (evt.target.closest("#clear-filters")) {
    state.filters = {};
    render();
    return;
  }

  const target = evt.target.closest("[data-dim]");
  if (!target) return;

  toggleFilter(target.dataset.dim, target.dataset.val);
});

el("trend-filters").addEventListener("click", (evt) => {
  const button = evt.target.closest("button[data-mode]");
  if (!button) return;

  state.trendMode = button.dataset.mode;
  for (const b of el("trend-filters").querySelectorAll("button[data-mode]")) {
    b.setAttribute("aria-pressed", String(b === button));
  }
  renderTrend();
  animateIn();
});

// ---------- загрузка и обновление ----------

const REDIRECTED = "redirected";

let firstLoad = true;

async function callApi(path, options) {
  const response = await fetch(path, { credentials: "same-origin", ...options });

  if (response.status === 401 || response.status === 403) {
    window.location.href = "/login";
    throw new Error(REDIRECTED);
  }

  const body = await response.json().catch(() => null);

  // detail приходит от сервера и объясняет причину человеку: какой
  // переменной не хватает, что ответил Google. Терять его нельзя.
  if (!response.ok) {
    throw new Error(body?.detail || `${response.status} ${response.statusText}`);
  }

  return body;
}

function setStamp(capturedAt, note) {
  const focus = state.data?.kpi?.focus_area;
  const when = capturedAt
    ? `обновлено ${new Date(capturedAt).toLocaleString("ru-RU", { dateStyle: "short", timeStyle: "short" })}`
    : "";

  el("stamp").textContent = [when, note, focus && `зона роста: ${focus}`]
    .filter(Boolean).join(" · ");
}

/* После обновления набор строк мог измениться. Фильтр на исчезнувшее
   значение дал бы пустую страницу без внятной причины, поэтому такие
   условия снимаем молча. */
function pruneFilters() {
  for (const dim of DIMS) {
    const value = state.filters[dim];

    if (value != null && !state.data.rows.some((row) => row[dim] === value)) {
      delete state.filters[dim];
    }
  }
}

function applySnapshot(body, note) {
  state.data = body.data;
  pruneFilters();

  el("message").classList.add("hidden");
  el("content").classList.remove("hidden");
  el("refresh").hidden = false;

  if (firstLoad) {
    // Класс появления снимаем после проигрыша: иначе блоки заново
    // выезжали бы при каждом пересчёте по фильтру, и это утомляло бы.
    el("content").classList.add("intro");
    setTimeout(() => el("content").classList.remove("intro"), 900);
    firstLoad = false;
  }

  setStamp(body.captured_at, note);
  render();
}

function showEmpty(body) {
  el("stamp").textContent = "";
  el("message").textContent = body.data
    ? "Журнал пуст — в таблице нет строк с вопросами."
    : "Данных пока нет: синхронизация с таблицей ещё не отработала.";
  // Кнопку показываем и тут: именно в этом состоянии она нужнее всего,
  // иначе остаётся только ждать десять минут до тика воркера.
  el("refresh").hidden = false;
}

function flashStamp() {
  const node = el("stamp");
  node.classList.remove("flash");
  void node.offsetWidth;  // перезапуск анимации: без этого класс не сыграет заново
  node.classList.add("flash");
}

async function refresh() {
  const button = el("refresh");

  if (button.disabled) return;

  button.disabled = true;
  button.dataset.busy = "1";
  el("refresh-label").textContent = "Читаю таблицу…";

  try {
    const body = await callApi("/api/refresh", { method: "POST" });

    if (!body.data?.rows?.length) {
      showEmpty(body);
      return;
    }

    /* «Изменений нет» — это результат, а не сбой: значит таблицу с прошлого
       раза не правили. Молчать нельзя, иначе кнопка выглядит сломанной. */
    const note = body.skipped ? "только что обновляли"
      : body.changed ? "данные обновлены"
        : "изменений нет";

    applySnapshot(body, note);
    flashStamp();
  } catch (e) {
    if (e.message === REDIRECTED) return;
    setStamp(null, `не удалось обновить: ${e.message}`);
  } finally {
    delete button.dataset.busy;
    button.disabled = false;
    el("refresh-label").textContent = "Обновить";
  }
}

el("refresh").addEventListener("click", refresh);

(async () => {
  try {
    const body = await callApi("/api/summary");

    if (!body.data?.rows?.length) {
      showEmpty(body);
      return;
    }

    applySnapshot(body);
  } catch (e) {
    if (e.message === REDIRECTED) return;
    el("stamp").textContent = "";
    el("message").textContent = `Не удалось загрузить данные: ${e.message}`;
  }
})();
</script>
</body>
