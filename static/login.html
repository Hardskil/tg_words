<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Вход — SAT статистика</title>
<style>
  :root {
    --bg: #f6f7f9;
    --card: #ffffff;
    --text: #1a1d21;
    --muted: #6b7280;
    --border: #e3e6ea;
    --error-bg: #fdeaea;
    --error-text: #a32222;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14171a;
      --card: #1d2126;
      --text: #e8eaed;
      --muted: #9aa2ad;
      --border: #2c3238;
      --error-bg: #3a1f1f;
      --error-text: #ff9b9b;
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1.5rem;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  }

  .card {
    width: 100%;
    max-width: 26rem;
    padding: 2rem 1.75rem;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    text-align: center;
  }

  h1 { margin: 0 0 .5rem; font-size: 1.35rem; }

  p { margin: 0 0 1.5rem; color: var(--muted); line-height: 1.5; font-size: .95rem; }

  .error {
    padding: .75rem 1rem;
    border-radius: 8px;
    background: var(--error-bg);
    color: var(--error-text);
    font-size: .9rem;
  }

  .widget { display: flex; justify-content: center; min-height: 3rem; }

  .hint { margin: 1.5rem 0 0; font-size: .8rem; }
</style>
</head>
<body>
  <main class="card">
    <h1>SAT статистика</h1>
    <p>Доступ открыт подписчикам канала. Войдите через Telegram, чтобы мы могли проверить подписку.</p>

    {{MESSAGE}}

    <div class="widget">
      <script async
        src="https://telegram.org/js/telegram-widget.js?22"
        data-telegram-login="{{BOT_USERNAME}}"
        data-size="large"
        data-radius="8"
        data-auth-url="{{AUTH_URL}}"></script>
    </div>

    <p class="hint">Мы получаем только имя и Telegram ID. Доступа к переписке у сайта нет.</p>
  </main>
</body>
</html>
